[project]
name = "ebook-langlearner"
version = "0.1.0"
description = "Annotate rare words in EPUB files with translations for language learners"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "wordfreq>=3.1",
    "simplemma>=1.1",
    "click>=8.1",
    "requests>=2.31",
    "platformdirs>=4.2",
]

[project.scripts]
ebook-langlearner = "ebook_langlearner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ebook_langlearner"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "ruff>=0.8",
    "playwright>=1.48",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# Strict by default. Every category here is kept on project-wide. Fix the code,
# not the rule — suppression comments are forbidden (see AGENTS.md).
select = [
    "A",     # flake8-builtins
    "ANN",   # flake8-annotations
    "ARG",   # flake8-unused-arguments
    "B",     # flake8-bugbear
    "BLE",   # blind except
    "C4",    # comprehensions
    "D",     # pydocstyle
    "DTZ",   # datetimez
    "E", "W",# pycodestyle
    "EM",    # error messages
    "ERA",   # eradicate (commented-out code)
    "F",     # pyflakes
    "FBT",   # boolean trap
    "G",     # logging format
    "I",     # isort
    "ICN",   # import conventions
    "N",     # pep8-naming
    "PERF",  # perflint
    "PIE",
    "PL",    # pylint subset
    "PT",    # pytest style
    "PTH",   # pathlib
    "Q",     # quotes
    "RET",   # return style
    "RSE",   # raise style
    "RUF",   # ruff-specific
    "S",     # bandit
    "SIM",
    "SLF",   # private member access
    "T20",   # print
    "TCH",   # type-checking block
    "TID",   # tidy imports
    "TRY",   # tryceratops
    "UP",    # pyupgrade
]
ignore = [
    "E501",    # long lines handled by formatter
    "D203",    # conflicts with D211 (no blank line before class docstring)
    "D213",    # conflicts with D212 (multi-line summary on first line)
    "ANN401",  # Allow typing.Any where truly needed (rare; still reviewed case-by-case)
    "PLR0913", # too many arguments — fine for configurable dataclasses/commands
    "TRY003",  # long exception messages are fine in a CLI-oriented codebase
    "EM101",   # string literal in raise is acceptable for user-facing errors
    "EM102",   # f-string literal in raise is acceptable
    "S101",    # `assert` is allowed; actual assert misuse is flagged by B011
]

[tool.ruff.lint.per-file-ignores]
# Tests use assert liberally, import fixtures, and don't need full docstrings.
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "ANN001", "ANN201", "ANN202", "PLR2004", "SLF001"]
# The package dunder init re-exports; docstring coverage is at module level.
"**/__init__.py" = ["D104"]
# Build scripts are entry points; stdout progress is the intended output.
"scripts/**" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "e2e: end-to-end tests that build and render a full EPUB (slow)",
    "network: tests that hit the network (skipped by default)",
]
