<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Open book: two pages meeting at the spine -->
  <path d="M6 12 Q12 9 24 11 V40 Q12 38 6 41 Z"
        fill="#f7f3e8" stroke="#3a4a5e" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M42 12 Q36 9 24 11 V40 Q36 38 42 41 Z"
        fill="#f7f3e8" stroke="#3a4a5e" stroke-width="1.6" stroke-linejoin="round"/>
  <line x1="24" y1="11" x2="24" y2="40" stroke="#3a4a5e" stroke-width="1.2"/>

  <!-- Faint text lines on each page -->
  <line x1="9" y1="20" x2="20" y2="20.6" stroke="#a9b3bf" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="9" y1="24" x2="20" y2="24.6" stroke="#a9b3bf" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="9" y1="32" x2="20" y2="32.6" stroke="#a9b3bf" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="28" y1="20" x2="39" y2="20.6" stroke="#a9b3bf" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="28" y1="32" x2="39" y2="32.6" stroke="#a9b3bf" stroke-width="0.9" stroke-linecap="round"/>

  <!-- Highlighted "ruby" word on the right page: base letter + small letter above it -->
  <text x="29.5" y="29.6" font-family="Georgia, serif" font-size="9" font-weight="700" fill="#3a4a5e">A</text>
  <text x="30" y="22.5" font-family="Georgia, serif" font-size="5" fill="#c4664a">ä</text>
</svg>
